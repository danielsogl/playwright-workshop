name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Run solutions (chromium)
      # Visual-Baselines sind plattformabhängig und per .gitignore nicht versioniert,
      # auf einem frischen Checkout schlagen sie immer fehl. Deshalb ausgeschlossen.
      env:
        RSS_OFFLINE_MODE: 'true'
        TEST_USER_EMAIL: test@example.com
        TEST_USER_PASSWORD: password
      run: |
        AUTH_SECRET=$(openssl rand -base64 32) \
          npm run e2e:solutions -- --project=chromium --grep-invert "Visual Regression Testing"
    - uses: actions/upload-artifact@v5
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
